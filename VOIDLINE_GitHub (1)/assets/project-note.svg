<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img"><rect width="1200" height="300" fill="#0d1117"/><text x="32" y="36" fill="#a96a75" font-family="monospace" font-size="17" font-weight="400" letter-spacing="2">02</text><text x="87" y="36" fill="#888d97" font-family="monospace" font-size="17" font-weight="400" letter-spacing="3">IN DEVELOPMENT</text><text x="32" y="104" fill="#ece8e2" font-family="Arial, sans-serif" font-size="37" font-weight="700" letter-spacing="0">Телефон звонит. Память подводит.</text><text x="32" y="151" fill="#b8b9bf" font-family="Arial, sans-serif" font-size="25" font-weight="400" letter-spacing="0">DONT ANSWER — психологический хоррор о том, чему можно верить,</text><text x="32" y="188" fill="#b8b9bf" font-family="Arial, sans-serif" font-size="25" font-weight="400" letter-spacing="0">когда собственные воспоминания перестают быть опорой.</text><text x="32" y="240" fill="#a5a5ae" font-family="Arial, sans-serif" font-size="22" font-weight="400" letter-spacing="0">Визуальная новелла · исследование пространства · телефонные взаимодействия</text><text x="32" y="282" fill="#ae7780" font-family="monospace" font-size="17" font-weight="400" letter-spacing="2">GODOT 4 / GDSCRIPT</text></svg>